# Run definitions for the AI job-ad annotation pipeline (config/netrun_annotations.json).
# Defaults below cover all six LLM passes. For the smoke run Passes 2/3/4/6 are
# routed `post_filter` (Pass-1-positive only) while Pass 1 and Pass 5 are `full`,
# which gives the spec's prefilter miss-rate measurement on Pass 1 and exercises
# every downstream pass on whatever AI-positive ads exist.

[defaults]
sample_n = 5000
llm_model = "gemma-27b-sbatch"
sbatch_cache = true
duckdb_memory_limit = "4GB"
temperature = 0.0
top_p = 1.0
top_k = -1

[defaults.build_annotation_universe]
input_run_name = "production_5m"

[defaults.build_annotation_routing]
# Pass 1 routed `full` so the Pass-0-vs-Pass-1 cross-tab (prefilter miss rate)
# is measurable from the smoke run itself.
batch1_route = "full"
# Pass 5 is seniority-for-all-ads; always `full` unless compute forces otherwise.
pass5_route = "full"
# Passes 2/3/4 follow Pass-1-positive routing by default — the spec's standard
# production setup. Override to `full` if you want every ad scored regardless.
batch2_route = "post_filter"
batch3_route = "post_filter"
# Pass 6 is a quality/robustness layer; default to inherit batch3_route, but
# the spec allows running it on `full` while Pass 4 stays post_filter.
pass6_route_override = "inherit"

[defaults.pass1_boolean_ai_detection]
sbatch_time = "04:00:00"
chunk_size = 200
max_new_tokens = 256
max_concurrent_chunks = 4
pass_resume = true
pass_max_retries = 1
pass_raise_on_failure = false
system_prompt = "ai_job_ad_annotations/pass1_boolean_ai_detection/system"
user_prompt = "ai_job_ad_annotations/pass1_boolean_ai_detection/user_v1"
prompt_version = "pass1_boolean_ai_detection_v1"

