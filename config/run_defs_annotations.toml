# ----------
#   Runs
# ----------

# Milestone 1 smoke run: 5000 ads from production_5m. All six passes wired;
# Pass 1 + Pass 5 on the full 5000, Passes 2/3/4/6 on the Pass-1-positive
# subset only. Launch with: uv run run-ai-ad-annotations annotation_smoke_5k
[runs.annotation_smoke_5k]
sample_n = 5000

# Variant that runs every pass on every ad (max coverage, more GPU time).
[runs.annotation_smoke_5k_full]
sample_n = 5000

[runs.annotation_smoke_5k_full.build_annotation_routing]
batch2_route = "full"
batch3_route = "full"

# Full production annotation run over all 5M ads. Post-filter on Batches 2/3
# is the right default; revisit once the Milestone-1 prefilter miss-rate is
# known.
[runs.annotation_production_5m]
sample_n = -1
