# AI keyword dictionary v1
#
# Used by the deterministic regex sweep over the production_5m corpus
# (see nbs/analysis/04_keyword_demand_analysis.ipynb). Every output that
# leaves the sweep is stamped with `dictionary_version` from this file.
#
# Schema
#   dictionary_version : str
#   [families.<key>]
#     display_name : str
#     terms        : list of str OR list of inline tables
#                    {canonical = "...", regex_override = "..."}.
#                    Bare strings get the auto-anchor rule applied (leading
#                    \b iff first char alphanumeric, trailing \b iff last
#                    char alphanumeric, literal "." escaped). regex_override
#                    bypasses the rule completely for special cases.

dictionary_version = "v1"

# -----------------------------------------------------------------------------
# Family 1: Generic AI mentions
# -----------------------------------------------------------------------------
[families.generic_ai]
display_name = "Generic AI"
terms = [
    "artificial intelligence",
    "ai",
    "ai-",
    "ai/",
    "a.i.",
    "algorithmic",
    "intelligent automation",
]

# -----------------------------------------------------------------------------
# Family 2: AI tool use & assistive phrasing
#   High-recall family that picks up AI diffusing into non-technical ads.
# -----------------------------------------------------------------------------
